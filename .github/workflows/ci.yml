name: CI — Gov Gen AI Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un `push` que llega mientras corre el anterior lo cancela, en vez de pagar los dos.
#
# Aquí importa por cómo se trabaja en este proyecto: el desarrollo va por bloques y se sube
# una tanda de commits al cerrar uno, así que sin esto GitHub arranca un run por commit y
# factura todos aunque solo el último interese. Con `github.ref` en el grupo, `main` y cada
# pull request se cancelan por separado.
#
# **El precio, dicho**: el commit intermedio se queda sin check propio, marcado como
# cancelado. Es aceptable porque lo que se despliega es la punta de la rama, no un commit del
# medio; si algún día hace falta el estado de cada commit —una bisección sobre resultados de
# CI, por ejemplo— esto es lo primero que hay que quitar.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.13"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: govgenai
          POSTGRES_USER: govgenai
          POSTGRES_PASSWORD: govgenai_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govgenai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://govgenai:govgenai_dev@localhost:5432/govgenai
      JWT_SECRET_KEY: ci-test-secret-key-at-least-32-chars-long
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: "60"
      # GOOGLE_API_KEY no se necesita: los tests unitarios/integración mockean el LLM
      # CI no levanta el microservicio del sandbox, así que `SANDBOX_BASE_URL` apuntaría a
      # `script-sandbox:5000` —un nombre de la red de Docker— y los dos tests que hablan con
      # él esperarían 30 s antes de fallar con `422 TEST_FAILED: Timeout`, que no parece un
      # problema de entorno. `TESTING=1` conmuta `sandbox_mode` a `local`, y está documentado
      # en `.env.example` para el mismo caso en desarrollo.
      TESTING: "1"

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # `--locked` afirma que `uv.lock` cuadra con `pyproject.toml`, y falla si no.
      #
      # Sin él, uv **vuelve a resolver en silencio**: «The project is re-locked before syncing
      # unless `--locked` or `--frozen` is provided», dicen sus propias páginas. O sea que un lock
      # caducado no daba ningún síntoma aquí — CI instalaba un conjunto de dependencias que el
      # lock no describía y el check seguía verde. Fue exactamente lo que pasó con el lock de la
      # raíz: EXT.3 retiró Docling del manifiesto el 2026-08-11, nadie regeneró el lock, y el
      # desajuste vivió **17 días** sin que nada lo dijera; sólo se veía como un fichero
      # modificado que reaparecía en el árbol del desarrollador y que, por prudencia, no se
      # commiteaba nunca.
      #
      # Va aquí y no en un paso propio de `uv lock --check`, a propósito: como `uv sync` relockea
      # antes de sincronizar, un paso de comprobación colocado DESPUÉS de la instalación no puede
      # fallar nunca —el fichero ya estaría reescrito—. Tendría que ir antes, y entonces afirma lo
      # mismo que este flag en dos sitios. Un mecanismo, no dos.
      #
      # **El precio, dicho**: el día que alguien edite un `pyproject.toml` sin relockear, esto se
      # pone rojo. Es lo que se quiere; por eso el paso lleva la razón en el nombre, para que no se
      # lea como una avería de infraestructura.
      - name: Install dependencies (--locked, el lock tiene que cuadrar con pyproject)
        run: uv sync --locked --all-extras

      - name: Lint (ruff)
        run: uv run ruff check app/

      # El contrato OpenAPI está en `.gitignore` —es un artefacto generado, no se edita a
      # mano— y `tests/test_openapi_export.py` comprueba que existe y que es OpenAPI 3.x.
      # Mientras CI corría el 42% de la suite ese fichero no se colectaba; al pasar a
      # `tests` entero (e0b2eb3) los dos tests de presencia se pusieron en rojo, porque en
      # este job nadie ejecutaba el exportador: solo lo hace el job `contract`, que es otra
      # máquina y otro checkout.
      #
      # Se genera aquí en vez de relajar los tests porque el exportador es offline (no
      # levanta Uvicorn ni toca la BD), cuesta segundos, y de paso convierte en aserción
      # real el `test_server_openapi_json_is_valid`, que hasta ahora se saltaba en CI por
      # falta del fichero.
      - name: Export OpenAPI schema (lo exige tests/test_openapi_export.py)
        run: uv run python export_openapi.py

      # Unit + integration + e2e en UNA sola invocación de pytest, a propósito (TST.1):
      # separados en dos procesos, el estado filtrado entre tests —un mock asignado a
      # una clase, un singleton contaminado— es invisible para CI. Así fue como
      # `WebSiteRepo.create = AsyncMock(...)` rompió 10 tests de integración durante
      # meses sin que ningún build se enterara.
      #
      # `-n0` desactiva el paralelismo que TST.4 puso por defecto en `addopts`, y es la otra
      # mitad de la misma razón: con 16 workers los tests se reparten entre procesos y el
      # estado filtrado vuelve a ser invisible, que es exactamente lo que este paso existe
      # para cazar. En local manda la velocidad; aquí manda la detección, y CI puede
      # permitirse los minutos.
      # `tests` entero, y no una lista de rutas. La lista que había aquí cubría 1.187 de los
      # 2.811 tests de la suite: **el 42%**. Fuera quedaban `tests/modules/redaccion` (647
      # tests) y `tests/modules/curation` (413), los dos módulos con más tests del proyecto,
      # más `tests/public_graphs` entero y todo `tests/api` salvo cuatro ficheros. Un rojo ahí
      # dejaba el check en verde, que es el mismo agujero que SEC.8.7 cerró para el árbol de
      # la raíz — y así pasaron inadvertidos los dos tests del sandbox que dependían de un
      # servicio ausente.
      #
      # Se pone `tests` y no una lista más larga **a propósito**: una lista vuelve a
      # desalinearse en cuanto alguien añade un directorio, y nadie se entera porque el
      # síntoma es un check verde. Medido: los directorios que faltaban tardan 2:33 en serie,
      # así que la cobertura completa cuesta minutos, no el triple del gate.
      #
      # Los dos gates de abajo repiten unos pocos de estos tests. La duplicación es
      # deliberada: cuesta segundos y compra que un fallo de aislamiento entre organizaciones
      # se lea como «no despliegues» y no como «un test en rojo».
      - name: Run the whole backend suite (single invocation, needs PostgreSQL)
        run: |
          uv run pytest \
            tests \
            -n0 \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      # SEC.8.7 — el árbol `tests/` de la RAÍZ del repo, que este job no ejecuta.
      #
      # CI corre con `working-directory: server`, así que solo ve `server/tests`. El árbol
      # de la raíz mezcla tests vivos (`tests/redaccion`, `tests/public_graphs`) con
      # huérfanos, y durante meses acumuló 12 rojos y 2 errores de colección —imports a
      # rutas que CUR.1 movió y a servicios ya borrados— sin que ningún check se pusiera
      # rojo. Colectar es barato y caza exactamente eso: un import a un módulo que ya no
      # existe. Ejecutarlos aquí no: dependen de otra configuración y de otra BD.
      - name: Collect root tests (catches imports to modules that no longer exist)
        working-directory: ${{ github.workspace }}
        run: uv run --project server pytest tests --collect-only -q --no-cov

      # Gate de aislamiento entre organizaciones (SEC.2, hallazgo A2). Paso PROPIO y no
      # una carpeta más del paso anterior, a propósito: si esto se pone en rojo hay acceso
      # horizontal entre organizaciones —un admin viendo chatbots y conversaciones de otra
      # administración— y eso no es «un test que falla», es un motivo para no desplegar.
      # Separarlo hace que se lea así en la lista de checks y que nadie lo confunda con una
      # regresión funcional cualquiera.
      # SEC.2.1 añade a este paso el modo de acceso por chatbot y la identidad delegada.
      # Van con el aislamiento y no con el resto de la suite por la misma razón: un chatbot
      # restringido que se abre, o una cabecera de actor que concede organizaciones, no son
      # «un test en rojo», son un motivo para no desplegar.
      # SEC.9.5 amplía este paso, y la razón es que los cuatro agujeros de SEC.9 estaban
      # justamente donde no miraba: la lista de abajo no incluía ninguno de los routers
      # añadidos en los bloques REV y MT. `test_router_inventory_is_walked.py` deja de
      # depender de que alguien amplíe esta lista —recorre el árbol de routers— y los tres
      # ficheros de aislamiento nuevos entran aquí porque un modelo, un prompt de plataforma
      # o el catálogo de automatizaciones cruzando de organización tampoco son «un test en
      # rojo»: son un motivo para no desplegar.
      - name: Access control gate — tenancy, chatbot access mode, delegated actor (blocks deploy)
        run: |
          uv run pytest \
            tests/api/test_tenant_isolation.py \
            tests/api/test_router_inventory_is_walked.py \
            tests/api/test_library_router_auth.py \
            tests/api/test_llm_configs_isolation.py \
            tests/api/test_activity_prompts_isolation.py \
            tests/modules/agents_hub/integration/test_mt16_aislamiento_dos_organizaciones.py \
            tests/api/test_chatbot_access_mode.py \
            tests/core/auth/test_delegated_actor.py \
            tests/api/test_auth_login.py \
            -n0 \
            --no-cov \
            -v

      # Gate de regresión del retrieval (RAG.1). Mide el MECANISMO de recuperación
      # —fusión híbrida, filtros, ranking— sobre el corpus de fixture con un embedding
      # determinista, así que es reproducible y corre en segundos. NO mide BGE-M3: eso
      # exige el corpus real y va por `python -m ...evaluation.run_golden`, a mano.
      # Falla solo si recall@5, recall@10 o MRR bajan más de 0,02 respecto a la baseline
      # versionada en tests/modules/agents_hub/evaluation/baselines/.
      - name: Retrieval regression gate (needs PostgreSQL)
        run: |
          uv run pytest \
            tests/modules/agents_hub/evaluation/ \
            -n0 \
            --no-cov \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: server/coverage.xml
          retention-days: 7

  contract:
    name: API Contract (OpenAPI → Orval → TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # `--locked` y no `--frozen`, por lo mismo que en el job de arriba: `--frozen` usa el lock
      # tal cual **sin comprobar que corresponda al manifiesto**, así que este job podía validar el
      # contrato OpenAPI contra un conjunto de dependencias que `pyproject.toml` ya no declara. No
      # reescribía nada —eso es lo que `--frozen` sí garantiza—, pero tampoco avisaba.
      - name: Install backend dependencies (--locked, el lock cuadra con pyproject)
        working-directory: server
        run: uv sync --locked

      - name: Export OpenAPI schema
        working-directory: server
        run: uv run python export_openapi.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate API client
        working-directory: frontend
        run: npm run generate:api

      - name: Upload generated API client
        uses: actions/upload-artifact@v7
        with:
          name: generated-api-client
          path: frontend/src/shared/api/generated/
          retention-days: 1

      - name: TypeScript contract check
        working-directory: frontend
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Frontend tests
        working-directory: frontend
        run: npm test

  a11y:
    name: Accessibility audit (WCAG 2.2 AA)
    runs-on: ubuntu-latest
    needs: contract

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Download generated API client
        uses: actions/download-artifact@v8
        with:
          name: generated-api-client
          path: frontend/src/shared/api/generated/

      - name: Run a11y baseline tests
        working-directory: frontend
        run: npm run test:a11y

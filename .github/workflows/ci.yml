name: CI — Gov Gen AI Platform

on:
  push:
    # `desarrollo` está aquí y NO en `deploy.yml`, y ésa es toda la gracia: desde el
    # 2026-09-02 el trabajo se empuja a esa rama para que un push no despliegue producción,
    # y `main` se reserva para desplegar (por bloque o conjunto de bloques). Sin esta línea,
    # empujar a la rama no ejecutaría **nada**: se perdería la comprobación que hoy corre en
    # cada push, que no es lo que se quería evitar.
    branches: [main, desarrollo]
  pull_request:
    branches: [main]

# Un `push` que llega mientras corre el anterior lo cancela, en vez de pagar los dos.
#
# Aquí importa por cómo se trabaja en este proyecto: el desarrollo va por bloques y se sube
# una tanda de commits al cerrar uno, así que sin esto GitHub arranca un run por commit y
# factura todos aunque solo el último interese. Con `github.ref` en el grupo, `main` y cada
# pull request se cancelan por separado.
#
# **El precio, dicho**: el commit intermedio se queda sin check propio, marcado como
# cancelado. Es aceptable porque lo que se despliega es la punta de la rama, no un commit del
# medio; si algún día hace falta el estado de cada commit —una bisección sobre resultados de
# CI, por ejemplo— esto es lo primero que hay que quitar.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.13"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: govgenai
          POSTGRES_USER: govgenai
          POSTGRES_PASSWORD: govgenai_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govgenai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://govgenai:govgenai_dev@localhost:5432/govgenai
      JWT_SECRET_KEY: ci-test-secret-key-at-least-32-chars-long
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: "60"
      # GOOGLE_API_KEY no se necesita: los tests unitarios/integración mockean el LLM
      # CI no levanta el microservicio del sandbox, así que `SANDBOX_BASE_URL` apuntaría a
      # `script-sandbox:5000` —un nombre de la red de Docker— y los dos tests que hablan con
      # él esperarían 30 s antes de fallar con `422 TEST_FAILED: Timeout`, que no parece un
      # problema de entorno. `TESTING=1` conmuta `sandbox_mode` a `local`, y está documentado
      # en `.env.example` para el mismo caso en desarrollo.
      TESTING: "1"

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # `--locked` afirma que `uv.lock` cuadra con `pyproject.toml`, y falla si no.
      #
      # Sin él, uv **vuelve a resolver en silencio**: «The project is re-locked before syncing
      # unless `--locked` or `--frozen` is provided», dicen sus propias páginas. O sea que un lock
      # caducado no daba ningún síntoma aquí — CI instalaba un conjunto de dependencias que el
      # lock no describía y el check seguía verde. Fue exactamente lo que pasó con el lock de la
      # raíz: EXT.3 retiró Docling del manifiesto el 2026-08-11, nadie regeneró el lock, y el
      # desajuste vivió **17 días** sin que nada lo dijera; sólo se veía como un fichero
      # modificado que reaparecía en el árbol del desarrollador y que, por prudencia, no se
      # commiteaba nunca.
      #
      # Va aquí y no en un paso propio de `uv lock --check`, a propósito: como `uv sync` relockea
      # antes de sincronizar, un paso de comprobación colocado DESPUÉS de la instalación no puede
      # fallar nunca —el fichero ya estaría reescrito—. Tendría que ir antes, y entonces afirma lo
      # mismo que este flag en dos sitios. Un mecanismo, no dos.
      #
      # **El precio, dicho**: el día que alguien edite un `pyproject.toml` sin relockear, esto se
      # pone rojo. Es lo que se quiere; por eso el paso lleva la razón en el nombre, para que no se
      # lea como una avería de infraestructura.
      - name: Install dependencies (--locked, el lock tiene que cuadrar con pyproject)
        run: uv sync --locked --all-extras

      - name: Lint (ruff)
        run: uv run ruff check app/

      # El contrato OpenAPI está en `.gitignore` —es un artefacto generado, no se edita a
      # mano— y `tests/test_openapi_export.py` comprueba que existe y que es OpenAPI 3.x.
      # Mientras CI corría el 42% de la suite ese fichero no se colectaba; al pasar a
      # `tests` entero (e0b2eb3) los dos tests de presencia se pusieron en rojo, porque en
      # este job nadie ejecutaba el exportador: solo lo hace el job `contract`, que es otra
      # máquina y otro checkout.
      #
      # Se genera aquí en vez de relajar los tests porque el exportador es offline (no
      # levanta Uvicorn ni toca la BD), cuesta segundos, y de paso convierte en aserción
      # real el `test_server_openapi_json_is_valid`, que hasta ahora se saltaba en CI por
      # falta del fichero.
      - name: Export OpenAPI schema (lo exige tests/test_openapi_export.py)
        run: uv run python export_openapi.py

      # BD.2 — el esquema lo define Alembic y SOLO Alembic, y esto es lo que lo demuestra.
      #
      # Hasta el 2026-09-04 la aplicación hacía además `create_all` al arrancar. Esa segunda
      # fuente nunca borra lo que dejó de estar declarado, y así quedaron 36 tablas de modelos
      # retirados en la base de desarrollo sin que nada lo dijera (BD.1). Y una deriva más fina
      # que un censo de tablas no ve: tres columnas `nullable=True` en su migración y `NOT NULL`
      # en su modelo, durante semanas, en producción también.
      #
      # `alembic check` compara los modelos con la base y falla si difieren. Tiene que ir DESPUÉS
      # de `upgrade head`: contra una base vacía propondría crearlo todo y estaría siempre rojo, y
      # un guardarraíl siempre rojo se desactiva. Cuesta segundos. Cuando esté rojo, la lectura es
      # una de dos: un modelo cambiado sin su migración, o una migración que dijo otra cosa que
      # el modelo. Las dos son un motivo para no fusionar.
      - name: Schema is defined by Alembic alone (upgrade head, then alembic check)
        run: |
          uv run alembic upgrade head
          uv run alembic check

      # Unit + integration + e2e en UNA sola invocación de pytest, a propósito (TST.1):
      # separados en dos procesos, el estado filtrado entre tests —un mock asignado a
      # una clase, un singleton contaminado— es invisible para CI. Así fue como
      # `WebSiteRepo.create = AsyncMock(...)` rompió 10 tests de integración durante
      # meses sin que ningún build se enterara.
      #
      # `-n0` desactiva el paralelismo que TST.4 puso por defecto en `addopts`, y es la otra
      # mitad de la misma razón: con 16 workers los tests se reparten entre procesos y el
      # estado filtrado vuelve a ser invisible, que es exactamente lo que este paso existe
      # para cazar. En local manda la velocidad; aquí manda la detección, y CI puede
      # permitirse los minutos.
      # `tests` entero, y no una lista de rutas. La lista que había aquí cubría 1.187 de los
      # 2.811 tests de la suite: **el 42%**. Fuera quedaban `tests/modules/redaccion` (647
      # tests) y `tests/modules/curation` (413), los dos módulos con más tests del proyecto,
      # más `tests/public_graphs` entero y todo `tests/api` salvo cuatro ficheros. Un rojo ahí
      # dejaba el check en verde, que es el mismo agujero que SEC.8.7 cerró para el árbol de
      # la raíz — y así pasaron inadvertidos los dos tests del sandbox que dependían de un
      # servicio ausente.
      #
      # Se pone `tests` y no una lista más larga **a propósito**: una lista vuelve a
      # desalinearse en cuanto alguien añade un directorio, y nadie se entera porque el
      # síntoma es un check verde. Medido: los directorios que faltaban tardan 2:33 en serie,
      # así que la cobertura completa cuesta minutos, no el triple del gate.
      #
      # Los dos gates de abajo repiten unos pocos de estos tests. La duplicación es
      # deliberada: cuesta segundos y compra que un fallo de aislamiento entre organizaciones
      # se lea como «no despliegues» y no como «un test en rojo».
      - name: Run the whole backend suite (single invocation, needs PostgreSQL)
        run: |
          uv run pytest \
            tests \
            -n0 \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      # SEC.8.7 cerró aquí un agujero: CI corre con `working-directory: server`, así que sólo
      # veía `server/tests`, y el árbol `tests/` de la RAÍZ acumuló durante meses doce rojos y
      # dos errores de colección sin que ningún check se pusiera rojo. Se colectaba, que es
      # barato y caza un import a un módulo que ya no existe.
      #
      # **NIC.4 retiró ese árbol** (2026-09-04): sus tests vivos se migraron a `server/tests`,
      # que este job ejecuta entero, y los huérfanos se fueron con el NiceGUI. El paso se
      # quedó sin sujeto — y borrarlo sin más habría dejado el agujero abierto en otro sitio,
      # porque **`shared/tests` y `mcp_server/tests` seguían igual de fuera**.
      #
      # Se **ejecutan** en vez de colectarse, y la razón la dio la medición: los dos rojos que
      # `shared/tests` tenía escondidos —`FieldDefinition`, retirado de `automatia_shared.dtos`
      # sin que nadie repuntara sus tests— importaban **dentro** de la función, así que un
      # `--collect-only` los habría dejado pasar. Cuestan 14 segundos entre los dos.
      # `--directory mcp_server` y `--extra dev`, y las dos cosas son la misma lección.
      # El primer intento fue `uv run --project mcp_server pytest mcp_server/tests` y CI dio
      # `error: Failed to spawn: pytest`. En local pasaba, porque el venv de `mcp_server/` ya
      # tenía pytest de sesiones anteriores; en CI se crea limpio, y `pytest` está declarado en
      # `[project.optional-dependencies] dev` —un EXTRA, no un grupo—, que `uv run` no instala
      # salvo que se le pida. `--directory` además pone el cwd dentro del proyecto, que es donde
      # su `[tool.pytest.ini_options]` (`testpaths`, `pythonpath = ["."]`) significa lo que dice.
      - name: Run the trees the server job does not see (shared, mcp_server)
        working-directory: ${{ github.workspace }}
        run: |
          uv run --project server pytest shared/tests -q --no-cov -p no:cacheprovider
          uv run --directory mcp_server --extra dev pytest tests -p no:cacheprovider

      # Gate de aislamiento entre organizaciones (SEC.2, hallazgo A2). Paso PROPIO y no
      # una carpeta más del paso anterior, a propósito: si esto se pone en rojo hay acceso
      # horizontal entre organizaciones —un admin viendo chatbots y conversaciones de otra
      # administración— y eso no es «un test que falla», es un motivo para no desplegar.
      # Separarlo hace que se lea así en la lista de checks y que nadie lo confunda con una
      # regresión funcional cualquiera.
      # SEC.2.1 añade a este paso el modo de acceso por chatbot y la identidad delegada.
      # Van con el aislamiento y no con el resto de la suite por la misma razón: un chatbot
      # restringido que se abre, o una cabecera de actor que concede organizaciones, no son
      # «un test en rojo», son un motivo para no desplegar.
      # SEC.9.5 amplía este paso, y la razón es que los cuatro agujeros de SEC.9 estaban
      # justamente donde no miraba: la lista de abajo no incluía ninguno de los routers
      # añadidos en los bloques REV y MT. `test_router_inventory_is_walked.py` deja de
      # depender de que alguien amplíe esta lista —recorre el árbol de routers— y los tres
      # ficheros de aislamiento nuevos entran aquí porque un modelo, un prompt de plataforma
      # o el catálogo de automatizaciones cruzando de organización tampoco son «un test en
      # rojo»: son un motivo para no desplegar.
      - name: Access control gate — tenancy, chatbot access mode, delegated actor (blocks deploy)
        run: |
          uv run pytest \
            tests/api/test_tenant_isolation.py \
            tests/api/test_router_inventory_is_walked.py \
            tests/api/test_library_router_auth.py \
            tests/api/test_llm_configs_isolation.py \
            tests/api/test_activity_prompts_isolation.py \
            tests/modules/agents_hub/integration/test_mt16_aislamiento_dos_organizaciones.py \
            tests/api/test_chatbot_access_mode.py \
            tests/core/auth/test_delegated_actor.py \
            tests/api/test_auth_login.py \
            -n0 \
            --no-cov \
            -v

      # Gate de regresión del retrieval (RAG.1). Mide el MECANISMO de recuperación
      # —fusión híbrida, filtros, ranking— sobre el corpus de fixture con un embedding
      # determinista, así que es reproducible y corre en segundos. NO mide BGE-M3: eso
      # exige el corpus real y va por `python -m ...evaluation.run_golden`, a mano.
      # Falla solo si recall@5, recall@10 o MRR bajan más de 0,02 respecto a la baseline
      # versionada en tests/modules/agents_hub/evaluation/baselines/.
      - name: Retrieval regression gate (needs PostgreSQL)
        run: |
          uv run pytest \
            tests/modules/agents_hub/evaluation/ \
            -n0 \
            --no-cov \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: server/coverage.xml
          retention-days: 7

  contract:
    name: API Contract (OpenAPI → Orval → TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # `--locked` y no `--frozen`, por lo mismo que en el job de arriba: `--frozen` usa el lock
      # tal cual **sin comprobar que corresponda al manifiesto**, así que este job podía validar el
      # contrato OpenAPI contra un conjunto de dependencias que `pyproject.toml` ya no declara. No
      # reescribía nada —eso es lo que `--frozen` sí garantiza—, pero tampoco avisaba.
      - name: Install backend dependencies (--locked, el lock cuadra con pyproject)
        working-directory: server
        run: uv sync --locked

      - name: Export OpenAPI schema
        working-directory: server
        run: uv run python export_openapi.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate API client
        working-directory: frontend
        run: npm run generate:api

      - name: Upload generated API client
        uses: actions/upload-artifact@v7
        with:
          name: generated-api-client
          path: frontend/src/shared/api/generated/
          retention-days: 1

      - name: TypeScript contract check
        working-directory: frontend
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Frontend tests
        working-directory: frontend
        run: npm test

  a11y:
    name: Accessibility audit (WCAG 2.2 AA)
    runs-on: ubuntu-latest
    needs: contract

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Download generated API client
        uses: actions/download-artifact@v8
        with:
          name: generated-api-client
          path: frontend/src/shared/api/generated/

      - name: Run a11y baseline tests
        working-directory: frontend
        run: npm run test:a11y

  # ---------------------------------------------------------------------------------------
  # Cadena de suministro: vulnerabilidades conocidas, inventario de dependencias y secretos.
  #
  # **Por qué existe, y no es por una exigencia externa todavía.** La OIATI planteó el
  # 2026-09-08 que antes de cada puesta en explotación generalizada haya una auditoría de
  # seguridad independiente, con el modelo del voto electrónico como precedente. Este job no
  # la sustituye: la prepara. Una auditoría sobre un código sin inventario de dependencias
  # gasta sus primeras horas construyendo el inventario, y encuentra CVE de librería —que
  # cualquier herramienta detecta— en vez de lo que sólo encuentra una persona mirando el
  # diseño.
  #
  # El otro motivo es concreto y está medido: el commit huérfano `dc4904e0c763` seguía
  # sirviendo `logs/` con 46 ficheros de datos reales 17 días después de reescribir el
  # historial. Un escáner de secretos no habría evitado aquello —no eran credenciales— pero
  # sí cierra la puerta al caso que sí lo sería.
  #
  # **Qué bloquea y qué informa, que es la decisión de diseño de este job.** Sólo bloquea
  # gitleaks sobre el árbol de trabajo: una credencial en el árbol es inequívoca y se arregla
  # quitándola. Los escáneres de vulnerabilidades **informan y no bloquean**, y no es
  # laxitud: sobre 408 dependencias transitivas aparecerá antes o después un CVE sin versión
  # corregida publicada, y un guardarraíl que se pone rojo por algo que quien lo lee no puede
  # arreglar es un guardarraíl que se desactiva —el mismo razonamiento que está escrito en el
  # paso de `alembic check`—. El camino es el del gate de retrieval: primero medir, y con la
  # medida encima de la mesa, fijar el umbral que sí bloquea.
  #
  # **El historial tampoco bloquea**, y por lo mismo: estaría rojo hasta que alguien
  # reescribiera el pasado, que no es una acción que un check de CI pueda pedir.
  # ---------------------------------------------------------------------------------------
  supply-chain:
    name: Supply chain — vulnerabilities, SBOM and secrets
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      # Pinada a propósito y verificada contra la página de releases el 2026-09-08. Subirla es
      # una decisión, no una deriva: una versión que se resuelve sola en cada ejecución es
      # justamente la clase de dependencia que este job existe para vigilar.
      GITLEAKS_VERSION: "8.30.1"

    steps:
      # `fetch-depth: 0` porque el escaneo del historial necesita el historial. Los demás jobs
      # se quedan con el clon superficial que basta para compilar y probar.
      - name: Checkout (full history — el escaneo de secretos lo necesita)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # `--locked` por lo mismo que en los otros dos jobs: sin él `uv export` puede volver a
      # resolver, y auditaríamos un conjunto de dependencias que el lock no describe — que es
      # exactamente el desajuste que vivió 17 días sin dar síntoma.
      #
      # `--no-emit-project` y `--no-emit-package automatia-shared` quitan **nuestro** código
      # del fichero. No es cosmético: `-e ../shared` es una ruta local que pip-audit no puede
      # resolver contra PyPI, y además auditar código propio contra una base de CVE de
      # terceros no dice nada. Sus dependencias sí están, resueltas en el mismo export.
      #
      # Medido en local el 2026-09-08: 408 dependencias en `server`, 38 en `mcp_server`, cero
      # editables en los dos.
      - name: Export the locked dependency sets
        run: |
          mkdir -p sbom
          uv export --directory server --locked --no-dev --no-hashes \
            --no-emit-project --no-emit-package automatia-shared \
            --format requirements-txt -o "$GITHUB_WORKSPACE/sbom/server-requirements.txt"
          uv export --directory mcp_server --locked --no-dev --no-hashes \
            --no-emit-project \
            --format requirements-txt -o "$GITHUB_WORKSPACE/sbom/mcp-requirements.txt"

      # Sin versión pinada, a propósito y al revés que gitleaks: pip-audit consulta la base de
      # avisos viva de PyPI, así que lo que importa es que la herramienta siga al día. De cada
      # ejecución lo que queda registrado es el informe, no la versión del escáner.
      # El `|| rc=1` no es defensivo: arregla un agujero que la primera ejecución destapó. Los
      # dos comandos estaban encadenados sin más, `pip-audit` sale con código 1 cuando encuentra
      # algo, y el shell de GitHub aborta el paso al primer fallo. Como el paso lleva
      # `continue-on-error`, el job siguió en verde y **`mcp_server` no se auditó nunca**: en el
      # artefacto había `pip-audit-server.json` y no había `pip-audit-mcp.json`, que es la única
      # forma en que se notaba. Un paso que informa y se corta a la primera informa de la mitad.
      #
      # El `exit $rc` conserva lo que importa: el `outcome` del paso sigue diciendo la verdad, y
      # es lo que lee la tabla del resumen.
      # Este paso SIGUE sin bloquear, y a propósito: su trabajo es producir los dos informes,
      # no juzgarlos. Quien juzga es el paso siguiente, que lee el fichero de aceptados. Si este
      # paso bloqueara, `pip-audit` tumbaría el job por cualquier aviso —incluidos los que nadie
      # puede arreglar— y volveríamos justo al guardarraíl que se acaba desactivando.
      - name: Python dependency audit (pip-audit — produce los informes)
        id: pip_audit
        continue-on-error: true
        run: |
          rc=0
          uvx pip-audit -r sbom/server-requirements.txt \
            --format json --output sbom/pip-audit-server.json --progress-spinner off || rc=1
          uvx pip-audit -r sbom/mcp-requirements.txt \
            --format json --output sbom/pip-audit-mcp.json --progress-spinner off || rc=1
          exit $rc

      # **BLOQUEA**, y el criterio está escrito entero en el guion y en `avisos_aceptados.toml`:
      # un aviso con corrección publicada y sin aceptar pone rojo el build. Lo que no tiene
      # corrección informa.
      #
      # No es un umbral por severidad, que es lo que el plan proponía, porque **`pip-audit` no
      # informa de severidad**: sus entradas traen `id`, `aliases`, `description` y
      # `fix_versions`, y nada más. Un umbral por CVSS tendría que inventarse el dato o dejar un
      # hueco por el que pasan los avisos sin severidad, y eso no se ve en el verde.
      #
      # `if: always()` porque el paso anterior sale con 1 cuando encuentra algo —que es
      # precisamente cuando este paso hace falta— y `continue-on-error` solo dice «no tumbes el
      # job», no «ejecútalo igualmente». Es la misma lección que costó el escaneo del historial
      # saliendo `skipped` en la primera ejecución.
      - name: Vulnerability gate — Python (BLOCKS)
        if: always()
        run: |
          python scripts/puerta_de_avisos.py \
            sbom/pip-audit-server.json sbom/pip-audit-mcp.json \
            --aceptados avisos_aceptados.toml \
            --resumen "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # `--omit=dev` porque una vulnerabilidad en la cadena de construcción no viaja al
      # navegador de nadie. Interesa, pero no es el mismo riesgo, y mezclarlas hace que el
      # número deje de significar algo.
      # **BLOQUEA desde DEP.7**, y aquí sí por severidad: al revés que `pip-audit`, `npm audit`
      # la trae, así que `--audit-level=high` es un umbral real y no una aproximación. Medido el
      # 2026-09-15 antes de encenderlo: el árbol de producción está en **cero** avisos, así que
      # la puerta nace en verde y lo que vigila es la deriva futura.
      #
      # El `tee` conserva el informe pase lo que pase —el artefacto tiene que llevarlo también
      # cuando el paso se pone rojo, que es cuando más falta hace— y `PIPESTATUS` recupera el
      # código de `npm audit`, que sin él quedaría enmascarado por el del `tee`. Sin esas dos
      # líneas, bloquear habría costado perder el informe justo en el caso interesante.
      - name: JS dependency audit (npm audit — BLOCKS on high)
        id: npm_audit
        working-directory: frontend
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high --json \
            | tee "$GITHUB_WORKSPACE/sbom/npm-audit.json"
          exit "${PIPESTATUS[0]}"

      # El SBOM es lo que se le entrega a quien audite, y la razón de que la retención de este
      # artefacto sea de 90 días y no de 7 como la de cobertura: es evidencia con fecha de qué
      # se estaba ejecutando, y su valor aparece meses después.
      - name: Generate SBOM (CycloneDX)
        continue-on-error: true
        run: |
          uvx --from cyclonedx-bom cyclonedx-py requirements \
            sbom/server-requirements.txt -o sbom/sbom-server.cdx.json
          uvx --from cyclonedx-bom cyclonedx-py requirements \
            sbom/mcp-requirements.txt -o sbom/sbom-mcp.cdx.json
          npx --yes @cyclonedx/cyclonedx-npm --omit dev \
            --output-file "$GITHUB_WORKSPACE/sbom/sbom-frontend.cdx.json" \
            --package-lock-only frontend/package-lock.json

      # La suma se comprueba contra el fichero de sumas de la MISMA release, así que protege de
      # una descarga truncada o alterada en tránsito, no de una release comprometida. Se dice
      # para que nadie lea de aquí una garantía que no da.
      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o gitleaks.tar.gz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o gitleaks_checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" gitleaks_checksums.txt \
            | sed "s/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz/gitleaks.tar.gz/" \
            | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      # **El único paso que bloquea.** Un secreto en el árbol de trabajo no es un juicio de
      # valor ni depende de que exista parche aguas arriba: se quita y se rota.
      - name: Secret scan — working tree (BLOCKS)
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner --report-path sbom/gitleaks-tree.json

      # El historial informa y no bloquea: ponerlo a bloquear dejaría el check rojo hasta que
      # alguien reescribiera el pasado. Lo que sí hace es dejar constancia con fecha de qué hay
      # ahí atrás, que es la mitad del trabajo cuando toca decidir si una fuga sigue viva.
      #
      # **`if: always()` y no sólo `continue-on-error`**, y la diferencia la enseñó la primera
      # ejecución: `continue-on-error` dice «si este paso falla, no tumbes el job», no «ejecuta
      # este paso aunque uno anterior fallara». Con el escaneo del árbol en rojo, éste salió
      # `skipped` — justo el día en que más falta hacía saber qué había en el historial.
      - name: Secret scan — full history (informa, no bloquea)
        if: always()
        continue-on-error: true
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner --report-path sbom/gitleaks-history.json

      # Sin esto hay que descargar el artefacto para saber si algo salió mal, y un informe que
      # cuesta tres clics no se mira.
      - name: Summarise
        if: always()
        run: |
          {
            echo "## Cadena de suministro"
            echo ""
            echo "| Comprobación | Resultado |"
            echo "|---|---|"
            echo "| pip-audit (server + mcp, informa) | ${{ steps.pip_audit.outcome }} |"
            echo "| npm audit (frontend, prod — BLOQUEA en high) | ${{ steps.npm_audit.outcome }} |"
            echo ""
            echo "Informes completos y SBOM en el artefacto \`supply-chain\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM and audit reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: supply-chain
          path: sbom/
          retention-days: 90

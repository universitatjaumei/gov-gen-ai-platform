name: CI — Gov Gen AI Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.13"]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: govgenai
          POSTGRES_USER: govgenai
          POSTGRES_PASSWORD: govgenai_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U govgenai"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://govgenai:govgenai_dev@localhost:5432/govgenai
      JWT_SECRET_KEY: ci-test-secret-key-at-least-32-chars-long
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: "60"
      # GOOGLE_API_KEY no se necesita: los tests unitarios/integración mockean el LLM

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check app/

      - name: Run unit tests
        run: |
          uv run pytest tests/modules/agents_hub/unit/ \
            tests/unit/test_jwt_handler.py \
            tests/unit/test_auth_context.py \
            tests/api/test_role_context.py \
            --no-cov \
            -v

      - name: Run integration & E2E tests (needs PostgreSQL)
        run: |
          uv run pytest \
            tests/modules/agents_hub/integration/ \
            tests/modules/agents_hub/e2e/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: server/coverage.xml
          retention-days: 7

  contract:
    name: API Contract (OpenAPI → Orval → TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        working-directory: server
        run: uv sync --frozen

      - name: Export OpenAPI schema
        working-directory: server
        run: uv run python export_openapi.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate API client
        working-directory: frontend
        run: npm run generate:api

      - name: TypeScript contract check
        working-directory: frontend
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Frontend tests
        working-directory: frontend
        run: npm test

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sonda de salud del propio nginx (distinta del /health del backend).
    location /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # El backend vive bajo /api/* (ver server/app/main.py). Same-origin: el
    # frontend se compila con VITE_API_URL="" y llama a rutas relativas, así
    # que nginx reenvía tal cual sin reescribir el path.
    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El chat SSE (/api/v1/hub/chat/*) necesita streaming sin buffer: si
        # nginx bufferiza la respuesta, el usuario no ve tokens hasta el final.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}

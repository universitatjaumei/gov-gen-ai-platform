publicada. **No hay versión corregida**, de modo que subir tampoco resuelve nada aquí.

`ragas` está en el extra `evaluacion` y no se instala en el despliegue —verificado en el
contenedor el 2026-09-23: `ragas: no instalado`—, y su import en el código de evaluación está
envuelto en `try/except ImportError` con caída a una métrica léxica. Se conserva porque la
evaluación con métricas de RAG se usa a mano contra el lote `ujirag-2024`; retirarlo por dos
avisos que no alcanzan a producción sería pagar capacidad por ruido.

**Al renovar**: mirar si el aviso ya tiene corrección, y si el módulo afectado sigue sin usarse
—la evaluación de este proyecto no llama a las métricas multimodales—. Si alguna de las dos cosas
cambió, esta entrada se retira o se sustituye por la subida.
"""
acepta = "Modesto Fabra"
caduca = "2027-03-01"

# Avisos de seguridad aceptados a propósito, con fecha de caducidad
#
# Esto **no** es una lista de exclusiones. Una exclusión dice «no me lo cuentes»; una aceptación
# dice «lo he mirado, sé por qué sigue aquí, y esto caduca». La diferencia está en los cuatro
# campos obligatorios, y sobre todo en el último: **un aviso aceptado sin fecha es un aviso
# olvidado**, y una lista de olvidos con aspecto de política es peor que no tener política.
#
# La puerta de `ci.yml` (job `supply-chain`) consulta este fichero. El criterio, decidido el
# 2026-09-15 al cerrar DEP.7:
#
#   Un aviso BLOQUEA si tiene corrección publicada (`fix_versions` no vacío) y no está aceptado
#   aquí, o lo está pero su aceptación ha caducado. Si no hay corrección publicada, informa.
#
# **Por qué ese criterio y no «bloquear en alto y crítico», que es lo que el prompt proponía**:
# `pip-audit` no informa de severidad. Sus entradas traen `id`, `aliases`, `description` y
# `fix_versions`, y ni un CVSS ni una etiqueta «high». Un umbral por severidad sobre el lado
# Python tendría que inventarse el dato o dejar un hueco silencioso —los avisos sin severidad no
# bloquearían nunca—, que es la forma de avería que este proyecto ya se ha comido dos veces.
# «¿Tiene corrección?» sí es un dato que la herramienta da, y además es **exactamente la pregunta
# que decide si quien lee el rojo puede hacer algo**: si hay versión corregida, se sube; si no la
# hay, subir no es una opción y el sitio del aviso es este fichero. Ésa era la razón escrita
# cuando el job nació informando, y este criterio la respeta en vez de contradecirla.
#
# El lado JavaScript sí tiene severidad, así que `npm audit` bloquea en `high` con
# `--audit-level=high`, sobre el árbol de producción (`--omit=dev`).
#
# Campos, los cuatro obligatorios:
#   id         El identificador tal y como lo emite la herramienta (PYSEC-…, CVE-…, GHSA-…).
#   paquete    A qué paquete afecta. Sirve para revisar la entrada sin buscar el aviso.
#   motivo     POR QUÉ se acepta. No vale «no aplica»: hay que poder rebatirlo dentro de un año.
#   acepta     Quién lo aceptó. Una persona, no un equipo: alguien tiene que poder explicarlo.
#   caduca     ISO 8601. Al llegar la fecha, `test_dep7_las_aceptaciones_caducan.py` se pone rojo.
#
# Para renovar una aceptación se vuelve a mirar y se cambia la fecha, con el motivo al día. Es
# deliberadamente un poco incómodo: si renovar fuera gratis, la lista crecería sola y volveríamos
# a tener una lista de exclusiones con otro nombre.

# ---------------------------------------------------------------------------------------------
# **Ahora mismo no hay ninguna aceptación, y eso es el estado bueno, no un fichero a medias.**
#
# Hubo dos, sobre `diskcache` y `ragas`, aceptadas el 2026-09-23 porque ninguno de los dos avisos
# tenía versión corregida publicada y ninguno de los dos paquetes llegaba a la imagen desplegada.
# **Duraron un día.** Al mirar el aviso completo apareció que el proveedor de `ragas` no había
# respondido a la comunicación del fallo —o sea que la corrección no iba a llegar, y la condición
# de salida escrita en la aceptación nunca se habría cumplido—, y al ir a comprobarlo se midió
# algo que lo hacía irrelevante: **las dos funciones que usaban `ragas` no tenían ningún llamador
# fuera de los tests**. Se retiró el paquete, y las dos aceptaciones se fueron con él.
#
# La moraleja es la que da sentido a este fichero: una aceptación es siempre la segunda mejor
# opción. Antes de escribir por qué convives con un aviso, conviene preguntarse si de verdad
# necesitas lo que lo trae. Aquí la respuesta era no, y nadie lo había comprobado.
#
# Antes hubo otra: PYSEC-2026-3447, sobre `setuptools`, aceptada en DEP.7 porque la corrección estaba
# en la 83.0.0 y `torch` 2.11 declaraba `setuptools<82`. Su motivo llevaba escrita la condición
# de salida —«al renovar, comprobar primero si `torch` ya ha levantado el techo»— y **APER.20 la
# encontró cumplida**: torch 2.13 declara `setuptools>=77.0.3` sin tope. Se subieron los dos y la
# aceptación se **retiró**, que es lo que tenía que pasarle. El historial de git guarda su texto.
#
# La lección va aquí y no en un mensaje de commit: lo fácil no es aceptar un aviso, es **renovar
# la aceptación sin volver a mirar** cuando llega la fecha. Ese día la lista deja de ser una lista
# de decisiones y vuelve a ser una lista de exclusiones con mejor letra, que es justo lo que este
# fichero existe para evitar.

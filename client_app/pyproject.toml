[project]
name = "automatia-client"
version = "0.1.0"
authors = [{ name = "Modesto Fabra", email = "fabra@uji.es" }]
license = "AGPL-3.0-or-later"
description = "AutomatIA Client Application - On-Premise Document Processing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "automatia-shared @ file:///${PROJECT_ROOT}/../shared",
    "nicegui>=1.4.0",
    "sqlmodel>=0.0.14",
    "aiosqlite>=0.19.0",
    "pandas",
    "openpyxl",
    "playwright",
    "browser-use",
    "python-dotenv",
    "odfpy",
    "Pillow",
    "pymupdf",
    "pydantic>=2.0.0",
    "pdfplumber",
    "pywebview>=6.1",
    "httpx>=0.27.0",
    "faker>=40.1.2",
    "spacy>=3.8.11",
    "watchdog>=3.0.0",
    "imapclient>=3.0.0",
]

[project.urls]
Repository = "https://github.com/ModestoFabra/gov-gen-ai-platform"

[tool.uv]
dev-dependencies = [
    "pytest",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = [
    "--verbose",
]

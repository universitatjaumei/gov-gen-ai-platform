[project]
name = "paquete-funcion-demo"
# La versión del paquete **es** la versión de la función: el anclaje de una plantilla es por
# mayor, así que subir a 1.3.0 no rompe nada y subir a 2.0.0 obliga a revisar y reanclar.
version = "1.2.0"
description = "Ejemplo mínimo de una función determinista empaquetada para Gov Gen AI Platform"
requires-python = ">=3.11"
dependencies = []

# El grupo es el que descubre `funciones_paquete.GRUPO_FUNCIONES`. El nombre del entry point es
# el nombre de la función dentro del paquete; junto al nombre de la distribución forma el
# `entry_point` del catálogo, «paquete-funcion-demo:contar_filas».
[project.entry-points."govgenai.funciones"]
contar_filas = "paquete_funcion_demo:CONTAR_FILAS"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paquete_funcion_demo"]

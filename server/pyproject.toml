[project]
name = "automatia-server"
version = "0.1.0"
description = "AutomatIA Brain Server - SaaS AI Services"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "automatia-shared",
    "fastapi>=0.111.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.0.0",
    "sqlmodel>=0.0.14",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "openpyxl>=3.1.0",
    "python-dotenv",
    "openai",
    "google-genai",
    "langchain-google-genai>=4.1.3",
    "langchain-openai>=1.1.7",
    "aiohttp>=3.12.15",
    "browser-use>=0.1.0",
    "playwright>=1.40.0",
    "pgvector>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "torch",
    "torchvision",
    "langfuse>=2.0.0",
    "docling>=2.0.0",
    "langdetect>=1.0.9",
    "langgraph>=1.1.0",
    "ragas>=0.2.0",
    "datasets>=3.0.0",
    "reportlab>=4.0.0",
    "sentence-transformers>=3.0.0",
    "apscheduler>=3.10.4",
    "fsspec>=2024.6.0",
    "gcsfs>=2024.6.0",
    "s3fs>=2024.6.0",
    "pandas>=2.0.0",
    "camelot-py>=0.11.0",
    "pdfplumber>=0.11.0",
    "spacy>=3.7",
    "faker>=22.0",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "python-docx>=1.1.0",
    "odfpy>=1.4.1",
    "python3-saml>=1.16.0",
    # Front-matter del corpus curado (ING.0.3). Estaba disponible como dependencia
    # transitiva; se declara porque la ingesta la importa en producción.
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "httpx>=0.27.0",
    "respx>=0.21",
    "ruff",
    "aiosqlite>=0.22.1",
    "pytest-xdist>=3.8.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
automatia-shared = { path = "../shared", editable = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[project.optional-dependencies]
shared = ["automatia-shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# TST.4: `addopts` mínimo, a propósito.
#
# La cobertura estaba forzada en TODA ejecución local y cuesta ~40 % (medido: 21,3 s → 12,8 s
# sobre `tests/public_graphs`). Quien la mide de verdad es CI, que ya pasa `--cov=app
# --cov-report=xml --cov-report=term-missing` explícito en sus dos invocaciones, así que
# quitarla de aquí no baja la cobertura vigilada ni un punto. En local, bajo demanda:
#
#     uv run pytest tests --cov=app --cov-report=term-missing
#
# `-n auto` reparte los tests entre los núcleos disponibles. Es seguro porque cada test que
# toca BD crea la suya con nombre único (fixture `db_url`), así que no hay estado compartido
# que serializar. Para depurar un fallo con la salida en orden: `-p no:randomly -n0`.
addopts = [
    "-n", "auto",
]

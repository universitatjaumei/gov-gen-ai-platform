[project]
name = "automatia"
version = "0.1.0"
description = "Migración de AutomatIA a NiceGUI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nicegui==3.4.1",
    "sqlmodel>=0.0.14",
    "aiosqlite>=0.19.0",
    "pandas",
    "openpyxl",
    "playwright",
    "browser-use",
    "python-dotenv",
    "openai",
    "google-genai",
    "odfpy",
    "Pillow",
    "pymupdf",
    "pydantic",
    "pdfplumber",
    "aiohttp>=3.12.15",
    "langchain-google-genai>=4.1.3",
    "langchain-openai>=1.1.7",
    "pywebview>=6.1",
    "cryptography>=46.0.3",
    "faker>=40.1.2",
    "spacy>=3.8.11",
    "imapclient>=3.0.1",
    "httpx>=0.28.1",
    "tenacity>=9.1.2",
    "watchdog>=6.0.0",
    "filelock>=3.20.3",
    "pyarrow>=14.0.0",
    "apscheduler>=3.10.0",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "reportlab>=4.0.0",
    "jinja2>=3.1.6",
    "jsonschema>=4.25.1",
]

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.7",
    "pytest",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff",
    "selenium>=4.40.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (may be slow)",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--verbose",
    "--cov=app",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=70"
]

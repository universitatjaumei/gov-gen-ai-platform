[project]
name = "govgenai-mcp"
version = "0.1.0"
authors = [{ name = "Modesto Fabra", email = "fabra@uji.es" }]
license = "AGPL-3.0-or-later"
description = "Servidor MCP stdio para autoría de plantillas y configuración de chatbots de Gov Gen AI Platform."
requires-python = ">=3.11"
dependencies = [
    # DEP.5 — el techo `<2` es deuda declarada, no una preferencia. `mcp` 2.x **renombra
    # `FastMCP` a `MCPServer`** y cambia más API: al subir sin techo, los cuatro ficheros de
    # test fallan ya en la recolección con `No module named 'mcp.server.fastmcp'`. Migrar es
    # trabajo de código con su propia verificación —el servidor MCP se comprueba contra el
    # despliegue real, con dos clientes concurrentes (REG.4)—, así que no cabe en un prompt de
    # subida de dependencias. Sin este techo, el próximo `uv lock --upgrade` rompe el servidor
    # MCP en silencio hasta que alguien ejecute su suite.
    "mcp[cli]>=1.25.0,<2",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    # REG.4: el transporte HTTP se sirve con uvicorn. Declarado y no heredado del extra
    # `cli` de `mcp`: el arranque del contenedor depende de este binario, y una dependencia
    # transitiva que desaparezca dejaria la imagen sin arrancar sin que nada lo advirtiera.
    "uvicorn>=0.30",
]

[project.urls]
Repository = "https://github.com/ModestoFabra/gov-gen-ai-platform"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "respx>=0.21",
]

# Aplicación, no librería: uv gestiona el venv con las dependencias pero no
# construye/instala este proyecto como paquete. Los módulos viven planos en el
# directorio y se importan vía pythonpath.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[project]
name = "automatia-shared"
version = "0.1.0"
description = "Shared DTOs, enums, validators and utilities for AutomatIA"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "AutomatIA Team"}
]
dependencies = [
    "pydantic>=2.0.0",
    "pymupdf>=1.23.0",
    "pdfplumber>=0.10.0",
    "pandas>=2.0.0",
    "filelock>=3.13.0",
    "cryptography>=42.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["automatia_shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

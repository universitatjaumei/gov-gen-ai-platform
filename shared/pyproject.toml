[project]
name = "automatia-shared"
version = "0.1.0"
description = "DTOs, enums y firma criptográfica compartidos entre el servidor y sus clientes"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [
    {name = "AutomatIA Team"}
]
# Dos dependencias, y son exactamente las que importa el código que queda: `pydantic` para los
# DTO y `cryptography` para la firma de manifiestos. El resto es biblioteca estándar.
#
# Había cuatro más —`pymupdf`, `pdfplumber`, `pandas` y `filelock`— y ninguna la usaba el código
# vivo: eran de `core/execution_manager.py`, `core/pdf_reader.py` y `core/consolidator.py`, la
# maquinaria del agente de ejecución local de AutomatIA que se retiró en APER.12. Y no era
# gratis tenerlas: **`pdfplumber` metía `pillow`, que era el origen de 19 de los 28 avisos de
# seguridad que Dependabot encontró en este lock**. Se fueron sin actualizar nada, dejando de
# depender de ellas.
dependencies = [
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["automatia_shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

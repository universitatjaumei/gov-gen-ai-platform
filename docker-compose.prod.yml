services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govgenai_app
    env_file:
      - server/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-govgenai}:${POSTGRES_PASSWORD:-govgenai_dev}@postgres:5432/${POSTGRES_DB:-govgenai}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-govgenai}:${POSTGRES_PASSWORD:-govgenai_dev}@postgres:5432/${POSTGRES_DB:-govgenai}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
      MINIO_ENDPOINT: minio:9000
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SANDBOX_BASE_URL: http://script-sandbox:5000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      script-sandbox:
        condition: service_healthy
    networks:
      - default
      - sandbox-net
    restart: unless-stopped

  script-sandbox:
    build:
      context: ./services/script_sandbox
      dockerfile: Dockerfile
    container_name: govgenai_script_sandbox
    networks:
      - sandbox-net
    read_only: true
    tmpfs:
      - /tmp/sandbox:size=128M,mode=0700,uid=65534,gid=65534
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govgenai_migrate
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-govgenai}:${POSTGRES_PASSWORD:-govgenai_dev}@postgres:5432/${POSTGRES_DB:-govgenai}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-govgenai}:${POSTGRES_PASSWORD:-govgenai_dev}@postgres:5432/${POSTGRES_DB:-govgenai}
    working_dir: /app/server
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  langfuse:
    image: langfuse/langfuse:3
    container_name: govgenai_langfuse
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: govgenai-org
      LANGFUSE_INIT_ORG_NAME: "Gov Gen AI"
      LANGFUSE_INIT_PROJECT_ID: govgenai-project
      LANGFUSE_INIT_PROJECT_NAME: govgenai
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL}
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: govgenai_db_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./scripts/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: govgenai_minio_prod
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data_prod:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  sandbox-net:
    driver: bridge
    internal: true   # PROD: sin egress a internet, solo intercomunicación entre containers conectados

volumes:
  postgres_data_prod:
  minio_data_prod:
  langfuse_data_prod:

# docker-compose.prod.yml — Fase 11 "One-Click": levanta TODO el stack con
# `docker compose -f docker-compose.prod.yml up -d` (más `--profile ollama` si
# se quiere LLM local en vez de un proveedor cloud). Ver Prompt 11.3 para el
# script de arranque asistido (setup.sh) que envuelve este fichero.
#
# | Componente   | Opción cloud (GCP/Azure) | Opción autoinstalable (local) |
# |--------------|--------------------------|--------------------------------|
# | Cerebro (LLM)| Vertex AI / OpenAI/OpenRouter | Ollama (`--profile ollama`) |
# | Archivos     | GCS / S3                 | MinIO (este compose)          |
# | Identidad    | SSO SAML institucional   | login email+contraseña (por defecto) |
# | Despliegue   | Cloud Run / Terraform    | Docker Compose (este fichero) |

# Nombre de proyecto explícito y distinto de docker-compose.yml (dev): evita
# que Compose confunda ambos ficheros como el mismo proyecto y recree/elimine
# contenedores del otro entorno al levantar cualquiera de los dos.
name: govgenai-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govgenai_app
    env_file:
      - server/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-govgenai}:${POSTGRES_PASSWORD:-govgenai_dev}@postgres:5432/${POSTGRES_DB:-govgenai}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-govgenai}:${POSTGRES_PASSWORD:-govgenai_dev}@postgres:5432/${POSTGRES_DB:-govgenai}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_dev}
      MINIO_ENDPOINT: minio:9000
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SANDBOX_BASE_URL: http://script-sandbox:5000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      script-sandbox:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - default
      - sandbox-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Same-origin: nginx reenvía /api/* a "app" (ver frontend/nginx.conf).
        # No hace falta conocer un host público en tiempo de build.
        VITE_API_URL: ""
    container_name: govgenai_frontend
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: govgenai_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    profiles:
      - ollama

  script-sandbox:
    build:
      context: ./services/script_sandbox
      dockerfile: Dockerfile
    container_name: govgenai_script_sandbox
    environment:
      SANDBOX_TMP_DIR: /tmp/sandbox
    networks:
      - sandbox-net
    read_only: true
    tmpfs:
      - /tmp/sandbox:size=128M,mode=0700,uid=65534,gid=65534
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
    # SEC.8.3: los límites de CPU y memoria no acotan el número de procesos, así que una
    # fork-bomb agota los PID del host sin salirse de su presupuesto de memoria.
    pids_limit: 128
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govgenai_migrate
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-govgenai}:${POSTGRES_PASSWORD:-govgenai_dev}@postgres:5432/${POSTGRES_DB:-govgenai}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-govgenai}:${POSTGRES_PASSWORD:-govgenai_dev}@postgres:5432/${POSTGRES_DB:-govgenai}
    working_dir: /app/server
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  langfuse:
    image: langfuse/langfuse:3
    container_name: govgenai_langfuse
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: govgenai-org
      LANGFUSE_INIT_ORG_NAME: "Gov Gen AI"
      LANGFUSE_INIT_PROJECT_ID: govgenai-project
      LANGFUSE_INIT_PROJECT_NAME: govgenai
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL}
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: govgenai_db_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./scripts/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: govgenai_minio_prod
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data_prod:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  sandbox-net:
    driver: bridge
    internal: true   # PROD: sin egress a internet, solo intercomunicación entre containers conectados

# Nombres pinchados: ver la nota equivalente en docker-compose.yml. En producción
# esto además evita que mover o renombrar el directorio de instalación desconecte
# la base de datos del cliente.
volumes:
  postgres_data_prod:
    name: govgenai-prod_postgres_data_prod
  minio_data_prod:
    name: govgenai-prod_minio_data_prod
  ollama_data:
    name: govgenai-prod_ollama_data
